<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>935 Al Smith Dr — 3D Home &amp; Site Studio</title>
  <meta name="description" content="Interactive 3D model of 935 Al Smith Dr, McKees Rocks PA: floor plans, redesign, decorating, landscape and site analysis.">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">&#8962;</span><div><b>935 Al Smith Dr</b><small>3D Home &amp; Site Studio</small></div></div>
      <nav id="modes"></nav>
      <div class="top-actions">
        <button id="btn-undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
        <button id="btn-redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
        <button id="btn-shot" title="Save a PNG of the current view">Snapshot</button>
        <button id="btn-help" title="Controls &amp; tips">?</button>
      </div>
    </header>
    <aside id="left"></aside>
    <main id="viewport">
      <div id="hint"></div>
      <div id="levelbar"></div>
      <div id="viewbar"></div>
      <div id="compass" title="True north"><svg viewBox="-50 -50 100 100"><circle r="46" /><path class="n" d="M0,-40 L10,0 L0,-6 L-10,0Z"/><path class="s" d="M0,40 L10,0 L0,6 L-10,0Z"/><text y="-22">N</text></svg></div>
      <div id="walkhud" hidden><b>Walk mode</b> · WASD move · mouse look · Shift run · Space jump · F fly (Space/C) · Esc exit</div>
      <div id="loading"><div class="spinner"></div><div id="loadmsg">Loading terrain, parcel and house model…</div></div>
      <div id="toasts"></div>
    </main>
    <aside id="right">
      <div class="tabs" id="rtabs"></div>
      <div id="rpanel"></div>
    </aside>
    <footer id="statusbar"><div id="readout">Hover the scene for elevation, slope and coordinates</div><div id="status"></div></footer>
  </div>
  <div id="modal" hidden><div class="modal-card"><button class="close" id="modal-close">&times;</button><div id="modal-body"></div></div></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
